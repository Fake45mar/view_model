[build-system]
requires = ["setuptools==68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "views-model"
version = "0.1.0"
description = "Baseline model + serving for predicting job-posting views."
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "joblib==1.6.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
views-train = "views_model.train:main"
views-demo-artifact = "views_model.synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]
